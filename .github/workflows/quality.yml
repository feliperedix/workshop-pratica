name: Quality Pipeline

on:
  push:
    branches: 
    - dev
  pull_request:
    branches:
    - main

  
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip3 install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check src/ test/

  pytest-cov:
    runs-on: ubuntu-latest
    needs: ruff
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip3 install -r requirements-dev.txt

      - name: Run Unit pytest with coverage
        run: pytest -m unit --cov=src --cov-report=term-missing --cov-fail-under=80 --junitxml=report-pytest.xml

      - name: Publicar relatório de testes e cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report
          path: report-pytest.xml

      - name: Post coverage to Job Summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown --show-missing --skip-covered >> $GITHUB_STEP_SUMMARY
