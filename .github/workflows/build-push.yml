name: Build & Push

on:
  push:
    tags: ['v*']          # publica quando nasce uma tag de release

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    runs-on: self-hosted     # roda no runner registrado na sua máquina
    needs: build-push        # só depois do push da imagem
    steps:
      - name: Pull da imagem publicada
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Sobe o container (deploy idempotente)
        run: |
          docker rm -f calculadora || true
          docker run -d --name calculadora -p 8080:8080 ghcr.io/${{ github.repository }}:${{ github.ref_name }}